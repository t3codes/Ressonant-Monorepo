  - _id: req_workspaces_create
    parentId: wrk_ressonant_api
    type: request
    name: Create Workspace
    description: |
      Cria workspace. O owner é o usuário autenticado (extraído do JWT — nunca enviado no body).
    url: "{{ baseUrl }}/workspaces"
    method: POST
    body:
      mimeType: application/json
      text: |
        {
          "name": "Plataforma",
          "slug": "plataforma",
          "description": "Time de plataforma"
        }
    parameters: []
    headers:
      - { name: "Content-Type", value: "application/json" }
