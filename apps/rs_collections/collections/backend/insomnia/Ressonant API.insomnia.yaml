    settingCookies: []
    settingTimeout: ""

  - _id: req_users_create
    parentId: wrk_ressonant_api
    type: request
    name: Create User (admin)
    description: "Cria usuário (admin apenas). Podendo definir flags administrativas."
    url: "{{ baseUrl }}/users"
    method: POST
    body:
      mimeType: application/json
      text: |
        {
          "email": "admin@example.com",
          "senha": "SenhaForte123",
          "cpf": "11144477735",
          "telefone": "11987654322",
          "idade": 35,
          "termos_contrato": true,
          "status_ativo": true,
          "interno_adm": false
        }
    parameters: []
    headers:
      - { name: "Content-Type", value: "application/json" }
      - { name: "Authorization", value: "Bearer {{ accessToken }}" }
    auth: {}
