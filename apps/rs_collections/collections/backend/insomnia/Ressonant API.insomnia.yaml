      Adiciona membro ao workspace. Apenas owner ou admin do workspace.
      role: admin | member | viewer
    url: "{{ baseUrl }}/workspaces/{{ workspaceId }}/members"
    method: POST
    body:
      mimeType: application/json
      text: |
        {
          "user_id": "{{ memberUserId }}",
