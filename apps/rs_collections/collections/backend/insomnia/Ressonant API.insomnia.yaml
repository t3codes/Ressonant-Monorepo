resources:
  - _id: wrk_ressonant_api
    parentId: null
    type: workspace
    name: Ressonant API
    description: |
      Coleção de requisições da API Ressonant (Auth, Users, Workspaces, Health).
      Autenticação: JWT Bearer via header Authorization.
      O user_id é extraído exclusivamente do token — nunca trafegado por URL ou body.

      Ambientes:
      - Local Dev: http://localhost:8000
      - Homologação: https://api-homolog.ressonant.dev

  - _id: env_ressonant_local
    parentId: wrk_ressonant_api
    type: environment
    name: Local Dev
    data:
      baseUrl: "http://localhost:8000"
      accessToken: ""
      userId: ""
      workspaceId: ""
      memberUserId: ""
      skip: "0"
      limit: "50"
      status_ativo: ""

  - _id: env_ressonant_homolog
    parentId: wrk_ressonant_api
    type: environment
    name: Homologação
    data:
      baseUrl: "https://api-homolog.ressonant.dev"
      accessToken: ""
      userId: ""
      workspaceId: ""
      memberUserId: ""
      skip: "0"
      limit: "50"
      status_ativo: ""

