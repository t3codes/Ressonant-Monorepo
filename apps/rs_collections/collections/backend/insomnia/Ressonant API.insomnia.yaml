  - _id: req_auth_register
    parentId: wrk_ressonant_api
    type: request
    name: Register
    description: "Cadastro público de usuário comum. Retorna UserResponse (sem senha_hash)."
    url: "{{ baseUrl }}/auth/register"
    method: POST
    body:
      mimeType: application/json
      text: |
        {
          "email": "usuario@example.com",
          "senha": "SenhaForte123",
          "cpf": "12345678901",
          "telefone": "11987654321",
          "idade": 30,
          "termos_contrato": true
        }
    parameters: []
    headers:
      - { name: "Content-Type", value: "application/json" }
    auth: {}
    metaSortKey: -1699999999997.0
    isPrivate: false
    settingStoreCookies: true
    settingSendCookies: true
    settingDisableRenderRequestBody: false
    settingEncodeUrl: true
    settingRebuildPath: true
    settingCookies: []
    settingTimeout: ""

  - _id: req_auth_login
    parentId: wrk_ressonant_api
    type: request
    name: Login
    description: "Autentica por e-mail e senha. Devolve access_token JWT HS256 (30 min)."
    url: "{{ baseUrl }}/auth/login"
    method: POST
    body:
      mimeType: application/json
      text: |
        {
          "email": "usuario@example.com",
          "senha": "SenhaForte123"
        }
    parameters: []
    headers:
      - { name: "Content-Type", value: "application/json" }
    auth: {}
    metaSortKey: -1699999999996.0
    isPrivate: false
    settingStoreCookies: true
    settingSendCookies: true
    settingDisableRenderRequestBody: false
    settingEncodeUrl: true
    settingRebuildPath: true
    settingCookies: []
    settingTimeout: ""

  - _id: req_auth_me
    parentId: wrk_ressonant_api
    type: request
    name: Me
    description: "Dados do usuário autenticado. user_id extraído exclusivamente do JWT."
    url: "{{ baseUrl }}/auth/me"
    method: GET
    body: {}
    parameters: []
    headers:
      - { name: "Authorization", value: "Bearer {{ accessToken }}" }
    auth: {}
