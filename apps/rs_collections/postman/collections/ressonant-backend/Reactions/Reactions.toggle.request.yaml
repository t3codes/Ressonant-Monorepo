$kind: http-request
name: 'Reactions - Toggle'
method: POST
url: '{{baseUrl}}/messages/{{messageId}}/reactions'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "message_id": "{{messageId}}",
      "user_id": "{{userId}}",
      "emoji": "{{emoji}}"
    }
