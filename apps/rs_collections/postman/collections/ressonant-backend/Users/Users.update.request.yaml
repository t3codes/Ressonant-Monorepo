$kind: http-request
name: 'Users - Update'
method: PUT
url: '{{baseUrl}}/users/{{userId}}'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "telefone": "{{telefone}}",
      "idade": {{idade}},
      "termos_contrato": true
    }
