$kind: http-request
name: 'Mail - Create'
method: POST
url: '{{baseUrl}}/mail'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "senderId": "{{senderId}}",
      "recipientIds": {{recipientIds}},
      "ccIds": {{ccIds}},
      "bccIds": {{bccIds}},
      "subject": "{{subject}}",
      "body": "{{body}}",
      "threadId": "{{threadId}}",
      "isReply": {{isReply}},
      "forwarded": {{forwarded}},
      "attachments": {{attachments}}
    }
