$kind: http-request
name: 'Cards - Create'
method: POST
url: '{{baseUrl}}/cards'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "board_id": "{{boardId}}",
      "team_id": "{{teamId}}",
      "title": "{{title}}",
      "description": "{{description}}",
      "type": "{{type}}",
      "priority": "{{priority}}",
      "assignee_id": "{{assigneeId}}",
      "reporter_id": "{{reporterId}}",
      "due_date": "{{due_date}}",
      "start_date": "{{start_date}}",
      "objective": "{{objective}}",
      "points": {{points}},
      "fix_version": "{{fix_version}}",
      "budget_project": "{{budget_project}}",
      "parent_id": "{{parent_id}}",
      "column_id": "{{column_id}}"
    }
