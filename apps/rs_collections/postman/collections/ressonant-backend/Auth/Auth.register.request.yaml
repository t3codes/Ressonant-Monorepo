$kind: http-request
name: 'Auth - Register'
method: POST
url: '{{baseUrl}}/auth/register'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "senha": "{{senha}}",
      "cpf": "{{cpf}}",
      "idade": {{idade}},
      "termos_contrato": true,
      "telefone": "{{telefone}}"
    }
