$kind: http-request
name: 'Auth - Login'
method: POST
url: '{{baseUrl}}/auth/login'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "senha": "{{senha}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('login ok', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.environment.set('accessToken', pm.response.json().access_token);
      }
