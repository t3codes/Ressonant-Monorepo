$kind: http-request
name: 'Teams - Update'
method: PUT
url: '{{baseUrl}}/teams/{{teamId}}'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{name}}",
      "description": "{{description}}",
      "status_ativo": {{status_ativo}}
    }
