$kind: http-request
name: 'Boards - Update'
method: PUT
url: '{{baseUrl}}/boards/{{boardId}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{name}}",
      "description": "{{description}}",
      "status_ativo": {{status_ativo}}
    }
