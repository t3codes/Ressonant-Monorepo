# Molde para nova lib compartilhada sob o namespace `common`.
# Copie para packages/<nome>/pyproject.toml e ajuste `name` e `description`.
#
# Estrutura esperada:
#   packages/<lib>/
#   ├── pyproject.toml
#   ├── src/
#   │   └── common/              # SEM __init__.py (PEP 420)
#   │       └── <lib>/           # COM __init__.py
#   │           └── __init__.py
#   └── tests/

[project]
name = "common-<lib>"
version = "0.1.0"
description = "Descrição (namespace common.<lib>)."
requires-python = "==3.13.*"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
