name: Integration Test

run-name: Running integration tests of ${{ inputs.app_name }} on ${{ inputs.environment }}

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
        description: "Project whose integration suite runs against the deployed app"
      environment:
        type: string
        required: true
        description: "Environment key in deploy-config.yaml (development, staging); also the GitHub Environment"
      runs-on:
        type: string
        required: true
        description: "Runner with network access to the environment"
      stack-name:
        type: string
        required: false
        default: ""
        description: "DEV/QA stack; replaces __STACK_NAME__ in the deploy-config.yaml values"

jobs:
  integration-test:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: apps/${{ inputs.app_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          wget -qO "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Export integration test variables
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          STACK_NAME: ${{ inputs.stack-name }}
        run: |
          yq -o=props --properties-separator="=" ".integration_tests.${ENVIRONMENT}" deploy-config.yaml > it.env

          if [ "$ENVIRONMENT" = "development" ]; then
            sed -i "s/__STACK_NAME__/${STACK_NAME}/g" it.env
          fi

          cat it.env >> "$GITHUB_ENV"

      - name: Configuring integration test secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          prefix="$(echo "${APP_NAME}" | tr 'a-z-' 'A-Z_')_IT_"
          echo "${SECRETS_JSON}" \
            | yq -p=json -o=props --properties-separator="=" "with_entries(select(.key | test(\"^${prefix}\")))" \
            >> "$GITHUB_ENV"

      - name: Run integration tests
        run: make ci/integration-test

      - name: Coverage inventory
        run: make ci/integration-test/inventory
