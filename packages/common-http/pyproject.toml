[project]
name = "common-http"
version = "0.1.0"
description = "Clients HTTP reutilizáveis com pool de conexões (namespace common.http)."
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
