[project]
name = "common-s3"
version = "0.1.0"
description = "Cliente compartilhado de armazenamento S3 para apps do monorepo."
requires-python = "==3.13.*"
dependencies = ["boto3>=1.35.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
