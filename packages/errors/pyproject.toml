[project]
name = "common-errors"
version = "0.1.0"
description = "General exceptions for the Ressonant ecosystem"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.136.1",
    "opentelemetry-api>=1.41.1",
    "pydantic>=2.13.3",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "faker>=40.38.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
