[project]
name = "common-check-structure"
version = "0.1.0"
description = "Valida a estrutura e a direção de imports das apps (namespace common.check_structure)."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "import-linter>=2.3",
]

[project.scripts]
check-structure = "common.check_structure.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src/common/check_structure", "tests"]
