[project]
name = "common-logs"
version = "0.1.0"
description = "Logging estruturado (namespace common.logs) baseado em structlog."
requires-python = "==3.13.*"
dependencies = [
    "opentelemetry-api>=1.41.1",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
