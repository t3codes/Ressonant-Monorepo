[project]
name = "common-datadog"
version = "0.1.0"
description = "Integração opcional Datadog APM, correlação de logs e métricas runtime."
requires-python = "==3.13.*"
dependencies = ["ddtrace>=2.20.0,<4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
